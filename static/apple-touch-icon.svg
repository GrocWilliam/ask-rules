<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2b632;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#e0592a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2372a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" fill="url(#grad)" rx="36"/>
  
  <!-- Icon content - Game die -->
  <g transform="translate(90, 90)">
    <rect x="-38" y="-38" width="76" height="76" 
          fill="#fffaf2" stroke="#fffaf2" stroke-width="5" rx="8"/>
    
    <!-- Dice dots (5 pattern) -->
    <circle cx="-21" cy="-21" r="6" fill="#c2372a"/>
    <circle cx="21" cy="-21" r="6" fill="#c2372a"/>
    <circle cx="0" cy="0" r="6" fill="#c2372a"/>
    <circle cx="-21" cy="21" r="6" fill="#c2372a"/>
    <circle cx="21" cy="21" r="6" fill="#c2372a"/>
  </g>
  
  <!-- Text AR -->
  <text x="90" y="155" 
        text-anchor="middle" 
        fill="#fffaf2" 
        font-family="Arial, sans-serif" 
        font-size="22" 
        font-weight="bold">AR</text>
</svg>
