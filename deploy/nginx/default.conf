server {
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Résolution DNS du backend à chaque requête (cache 10 s) plutôt qu'une seule
    # fois au démarrage de nginx : l'adresse interne du backend change quand il
    # redémarre, et nginx continuerait sinon d'appeler l'ancienne adresse.
    # NGINX_LOCAL_RESOLVERS est rempli depuis /etc/resolv.conf par l'image nginx
    # (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 dans Dockerfile.frontend).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 5s;
    # Variable dans proxy_pass = résolution au moment de la requête
    set $backend_upstream ${BACKEND_HOST}:${BACKEND_PORT};

    # Échouer vite si le backend est injoignable (60 s par défaut)
    proxy_connect_timeout 5s;

    # API reverse proxy (includes SSE endpoints)
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Uploaded files remain served by the API
    location /files/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health endpoint from the backend
    location = /health {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback for SvelteKit routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
